name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skills
        run: ./scripts/validate.sh

      - name: Lint bash
        run: make lint

      - name: Test bash
        run: make test
